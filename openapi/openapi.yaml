openapi: 3.1.0

info:
  title: Orders API (sample)
  version: 1.2.0
  summary: Sample REST API used to demonstrate an API documentation workflow.
  description: |
    This specification is part of a documentation portfolio project.
    The service is a sample API created for demonstration; the documentation
    workflow, structure and artifacts are the subject of the portfolio,
    not a live product.

    The spec is the single source of truth: the API reference, error model
    and webhook documentation are all generated from it.
  contact:
    name: API Documentation
    url: https://github.com/ekatmoz88-alt/portfolio
  license:
    name: MIT
    identifier: MIT

servers:
  - url: https://api.example.com/v1
    description: Production
  - url: https://api.sandbox.example.com/v1
    description: Sandbox — test data, reset weekly

tags:
  - name: Orders
    description: Create, retrieve and cancel orders.

security:
  - bearerAuth: []

paths:
  /orders:
    get:
      operationId: listOrders
      tags: [Orders]
      summary: List orders
      description: Returns orders in reverse chronological order, paginated by cursor.
      security:
        - bearerAuth: [orders:read]
      parameters:
        - $ref: "#/components/parameters/StatusFilter"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: A page of orders.
          content:
            application/json:
              schema:
                type: object
                required: [data, hasMore]
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/Order"
                  nextCursor:
                    type: [string, "null"]
                    description: Pass as `cursor` for the next page. Null on the last page.
                  hasMore:
                    type: boolean
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/RateLimited"

  /orders/{orderId}:
    get:
      operationId: getOrder
      tags: [Orders]
      summary: Retrieve an order
      description: Returns a single order by its identifier.
      security:
        - bearerAuth: [orders:read]
      parameters:
        - $ref: "#/components/parameters/OrderId"
        - name: include
          in: query
          required: false
          description: Expands related resources.
          schema:
            type: array
            items:
              type: string
              enum: [items, customer, payments]
      responses:
        "200":
          description: The requested order.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/RateLimited"

    delete:
      operationId: cancelOrder
      tags: [Orders]
      summary: Cancel an order
      description: |
        Cancels an order that has not shipped yet. Returns `409 order_already_shipped`
        once a shipment is registered — use the refund endpoint instead.
      security:
        - bearerAuth: [orders:write]
      parameters:
        - $ref: "#/components/parameters/OrderId"
      responses:
        "200":
          description: The cancelled order.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

webhooks:
  order.created:
    post:
      operationId: orderCreated
      summary: Order created
      description: Fires when an order is placed.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WebhookEvent"
      responses:
        "200":
          description: Event accepted. Any 2xx acknowledges delivery.

  order.paid:
    post:
      operationId: orderPaid
      summary: Order paid
      description: Fires when payment is captured.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WebhookEvent"
      responses:
        "200":
          description: Event accepted.

  order.shipped:
    post:
      operationId: orderShipped
      summary: Order shipped
      description: Fires when a shipment is registered.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WebhookEvent"
      responses:
        "200":
          description: Event accepted.

  order.cancelled:
    post:
      operationId: orderCancelled
      summary: Order cancelled
      description: Fires when an order is cancelled.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WebhookEvent"
      responses:
        "200":
          description: Event accepted.

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    OrderId:
      name: orderId
      in: path
      required: true
      description: Order identifier, format `ord_` plus 12 characters.
      schema:
        type: string
        pattern: "^ord_[0-9]{12}$"
    StatusFilter:
      name: status
      in: query
      required: false
      description: Filters by status. Repeat the parameter for multiple values.
      schema:
        $ref: "#/components/schemas/OrderStatus"
    Limit:
      name: limit
      in: query
      required: false
      description: Items per page.
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 25
    Cursor:
      name: cursor
      in: query
      required: false
      description: Cursor returned as `nextCursor` by the previous page.
      schema:
        type: string

  schemas:
    OrderStatus:
      type: string
      enum: [pending, paid, shipped, cancelled, refunded]

    OrderItem:
      type: object
      required: [sku, quantity, unitPrice]
      properties:
        sku:
          type: string
          description: Stock keeping unit.
        quantity:
          type: integer
          minimum: 1
        unitPrice:
          type: integer
          description: Price per unit in minor units.

    Order:
      type: object
      required: [id, status, currency, total, customerId, createdAt]
      properties:
        id:
          type: string
        status:
          $ref: "#/components/schemas/OrderStatus"
        currency:
          type: string
          pattern: "^[A-Z]{3}$"
          description: ISO 4217 code.
        total:
          type: integer
          description: Order total in minor units (cents).
        customerId:
          type: string
        items:
          type: array
          items:
            $ref: "#/components/schemas/OrderItem"
        createdAt:
          type: string
          format: date-time
          description: Creation timestamp, RFC 3339.

    WebhookEvent:
      type: object
      required: [id, type, createdAt, data]
      properties:
        id:
          type: string
          description: Unique event identifier. Deduplicate on this field.
        type:
          type: string
          enum: [order.created, order.paid, order.shipped, order.cancelled]
        createdAt:
          type: string
          format: date-time
        data:
          $ref: "#/components/schemas/Order"

    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              description: Machine-readable identifier. Safe to branch on.
            message:
              type: string
              description: Human-readable explanation. Wording may change.
            param:
              type: string
              description: Name of the offending parameter, when applicable.
            requestId:
              type: string
              description: Quote this when contacting support.

  responses:
    BadRequest:
      description: Malformed request or invalid parameter.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Unauthorized:
      description: Missing, expired or invalid access token.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Forbidden:
      description: Authenticated, but the token lacks the required scope.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotFound:
      description: Resource does not exist or is not visible to this token.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Conflict:
      description: Conflicts with the current state of the resource.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    RateLimited:
      description: Rate limit exceeded.
      headers:
        Retry-After:
          description: Seconds to wait before retrying.
          schema:
            type: integer
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
